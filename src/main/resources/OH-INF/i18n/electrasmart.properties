addon.electrasmart.name = Electra Smart Binding
addon.electrasmart.description = Controls Electra Smart air conditioners through the Electra cloud service.

thing-type.electrasmart.account.label = Electra Smart Account
thing-type.electrasmart.account.description = Gateway to the Electra Smart cloud. Requires the phone number of the Electra Smart app account.

thing-type.electrasmart.ac.label = Electra Air Conditioner
thing-type.electrasmart.ac.description = An Electra air conditioner registered in the Electra Smart app.

thing-type.electrasmart.account.config.otp.label = One-time Password
thing-type.electrasmart.account.config.otp.description = Code received by SMS after requesting a one-time password. It is cleared automatically once the sign-in succeeded.
thing-type.electrasmart.account.config.phoneNumber.label = Phone Number
thing-type.electrasmart.account.config.phoneNumber.description = Phone number of the Electra Smart app account in local Israeli format, for example 0521234567. A number entered with the +972 or 972 prefix is converted automatically.
thing-type.electrasmart.account.config.refreshInterval.label = Refresh Interval
thing-type.electrasmart.account.config.refreshInterval.description = How often the state of the air conditioners is polled from the Electra cloud.

thing-type.electrasmart.ac.config.deviceId.label = Device ID
thing-type.electrasmart.ac.config.deviceId.description = Identifier of the air conditioner. It is filled in automatically by discovery.

channel-type.electrasmart.power.label = Power
channel-type.electrasmart.power.description = Turns the air conditioner on or off.
channel-type.electrasmart.operational-mode.label = Operation Mode
channel-type.electrasmart.operational-mode.description = Operation mode of the air conditioner.
channel-type.electrasmart.target-temperature.label = Target Temperature
channel-type.electrasmart.target-temperature.description = Temperature the air conditioner aims for.
channel-type.electrasmart.indoor-temperature.label = Indoor Temperature
channel-type.electrasmart.indoor-temperature.description = Room temperature measured by the air conditioner.
channel-type.electrasmart.fan-speed.label = Fan Speed
channel-type.electrasmart.fan-speed.description = Fan speed of the indoor unit.
channel-type.electrasmart.swing-mode.label = Swing Mode
channel-type.electrasmart.swing-mode.description = Louver movement. Units that do not report a swing direction ignore this channel.
channel-type.electrasmart.shabat-mode.label = Shabat Mode
channel-type.electrasmart.shabat-mode.description = Enables the Shabat (Sabbath) mode of the air conditioner.
channel-type.electrasmart.turbo-mode.label = Turbo Mode
channel-type.electrasmart.turbo-mode.description = Enables the turbo mode, if the unit supports it.
channel-type.electrasmart.sleep-function.label = Sleep Function
channel-type.electrasmart.sleep-function.description = Enables the sleep function, if the unit supports it.
channel-type.electrasmart.ifeel.label = iFeel
channel-type.electrasmart.ifeel.description = Uses the temperature at the remote control instead of the indoor unit, if the unit supports it.
channel-type.electrasmart.last-contact.label = Last Contact
channel-type.electrasmart.last-contact.description = Seconds since the air conditioner last reported to the Electra cloud.
